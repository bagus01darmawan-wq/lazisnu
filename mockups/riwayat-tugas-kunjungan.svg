  <text x="450" y="1071" text-anchor="middle" fill="#5F6F69" font-family="Inter, Segoe UI, sans-serif" font-size="12">Filter Kunjungan dipisahkan dari Terjemput dan Tidak Dijemput.</text>
  <text x="450" y="1093" text-anchor="middle" fill="#8A918D" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">Nama kaleng, jumlah, dan tanggal lain hanya contoh tampilan.</text>
