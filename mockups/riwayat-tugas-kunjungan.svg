    <text x="570.5" y="808.5" text-anchor="middle" fill="#176B38" font-size="8.2" font-weight="700" letter-spacing="0.5">SELESAI</text>
    <text x="347" y="830" fill="#5F6F69" font-size="10.5">Kaleng non-aktif · Verifikasi</text>
    <path d="M297 850 h306" stroke="#EFE7DA"/>
