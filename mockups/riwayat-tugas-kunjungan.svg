      <path d="M565 177 Q573 169 581 177 M568 180 Q573 175 578 180 M572 183 Q573 182 574 183"/>
      <path d="M587 174 h17 a2 2 0 0 1 2 2 v11 a2 2 0 0 1-2 2 h-17 a2 2 0 0 1-2-2 v-11 a2 2 0 0 1 2-2z"/>
