    <path d="M267 913 h366" stroke="#E5D9C7"/>
    <g fill="none" stroke="#88958F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M307 940 l12-10 12 10 v15 h-8 v-10 h-8 v10 h-8z"/>
      <rect x="397" y="932" width="19" height="23" rx="3"/><path d="M402 938 h9 M402 943 h9 M402 948 h6"/>
      <path d="M489 933 l19 19 M508 933 l-19 19 M489 933 h19 v19"/>
      <circle cx="581" cy="940" r="8"/><path d="M567 957 c2-7 7-10 14-10s12 3 14 10"/>
