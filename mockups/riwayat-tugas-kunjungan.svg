<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5EE"/>
      <stop offset="1" stop-color="#EAE4D8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153F34"/>
      <stop offset="1" stop-color="#0B5740"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#24332E" flood-opacity="0.20"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#2C473E" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="267" y="157" width="366" height="846" rx="43"/>
    </clipPath>
  </defs>

  <rect width="900" height="1160" fill="url(#page)"/>
  <circle cx="90" cy="1040" r="170" fill="#E4D9C7" opacity="0.34"/>
  <circle cx="820" cy="160" r="210" fill="#DCE8DD" opacity="0.48"/>

  <text x="450" y="58" text-anchor="middle" fill="#1F8243" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">USULAN TAMPILAN MOBILE</text>
  <text x="450" y="91" text-anchor="middle" fill="#2C473E" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Riwayat aktivitas lebih jelas</text>

  <g filter="url(#phoneShadow)">
