events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # Blue-green upstream (dikelola oleh deploy-blue-green.sh).
    # Di-resolve per-request via resolver — IP container boleh berubah saat
    # blue/green di-recreate tanpa harus restart nginx (pola sama seperti staging).
    # NOTE: upstream.conf berisi `set` (variabel) sehingga hanya valid di dalam
    # blok server — di-include di tiap server block production di bawah.

    # Docker embedded DNS — agar proxy_pass variabel (staging) di-resolve per-request,
    # bukan di-cache saat startup (container staging sering di-recreate → IP berubah)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=10r/s;

    # Backend API
    server {
        listen 80;
        server_name api.lazisnu.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Web Dashboard
    server {
        listen 80;
        server_name dashboard.lazisnu.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SSL Backend
    server {
        listen 443 ssl;
        server_name api.lazisnu.site;

        include /etc/nginx/upstream.conf;

        ssl_certificate /etc/letsencrypt/live/api.lazisnu.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lazisnu.site/privkey.pem;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # SSL Web
    server {
        listen 443 ssl;
        server_name dashboard.lazisnu.site;

        include /etc/nginx/upstream.conf;

        ssl_certificate /etc/letsencrypt/live/api.lazisnu.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lazisnu.site/privkey.pem;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=web burst=20 nodelay;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Staging API ───
    server {
        listen 80;
        server_name staging-api.lazisnu.site;

        set $staging_backend "http://backend-staging:4001";

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass $staging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Staging API SSL ───
    server {
        listen 443 ssl;
        server_name staging-api.lazisnu.site;

        ssl_certificate /etc/letsencrypt/live/staging-api.lazisnu.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.lazisnu.site/privkey.pem;

        set $staging_backend "http://backend-staging:4001";

        location / {
            proxy_pass $staging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Staging Web ───
    server {
        listen 80;
        server_name staging.lazisnu.site;

        set $staging_backend "http://backend-staging:4001";
        set $staging_web "http://web-staging:4000";

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /v1/ {
            proxy_pass $staging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass $staging_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Staging Web SSL ───
    server {
        listen 443 ssl;
        server_name staging.lazisnu.site;

        ssl_certificate /etc/letsencrypt/live/staging-api.lazisnu.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.lazisnu.site/privkey.pem;

        set $staging_backend "http://backend-staging:4001";
        set $staging_web "http://web-staging:4000";

        location /v1/ {
            proxy_pass $staging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass $staging_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Uptime Kuma Status Page (Lapis 4b, Sesi 31) ───
    # HTTP → HTTPS redirect + certbot challenge
    server {
        listen 80;
        server_name status.lazisnu.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SSL Status Page — proxy ke Uptime Kuma (container uptime-kuma:3001)
    # WebSocket support untuk update real-time status
    server {
        listen 443 ssl;
        server_name status.lazisnu.site;

        ssl_certificate /etc/letsencrypt/live/status.lazisnu.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/status.lazisnu.site/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy ke container Uptime Kuma (via service name 'uptime-kuma' di docker network)
        location / {
            proxy_pass http://uptime-kuma:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # WebSocket — long-lived connection untuk real-time updates
            proxy_read_timeout 86400;
        }
    }
}
