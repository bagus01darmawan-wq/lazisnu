# Alertmanager configuration — Lazisnu
# Notifikasi alert Prometheus → Discord webhook (channel khusus Prometheus).
# Webhook URL TIDAK di-commit: diambil dari env DISCORD_WEBHOOK_PROMETHEUS
# (didefinisikan di /opt/lazisnu/.env.alertmanager di VM, chmod 600).

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord'

receivers:
  - name: 'discord'
    discord_configs:
      - webhook_url: '${DISCORD_WEBHOOK_PROMETHEUS}'
        # Title embed: [FIRING:1] AlertName (severity)
        title: '{{ template "discord.default.title" . }}'
        message: '{{ template "discord.default.message" . }}'
