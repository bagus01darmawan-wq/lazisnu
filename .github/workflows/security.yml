name: Security

# Workflow tambahan — tidak mengubah alur build/deploy di ci.yml.
# Tiga lapis:
#   1. Dependency review  → setiap PR, blokir dependensi baru ber-vulnerability/license buruk.
#   2. CodeQL             → analisis statis JS/TS (injection, XSS, path traversal, dll).
#   3. pnpm audit         → terjadwal + manual selalu jalan; di PR hanya
#                             jalan bila ada perubahan dependensi (hemat ~4 mnt).

on:
  pull_request:
    branches: [main, master]
    # Sama seperti ci.yml: markdown tidak bisa menambah kerentanan atau
    # mengubah hasil CodeQL/audit, jadi PR docs-only skip workflow ini.
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '*.md']
  schedule:
    # Setiap Senin 03:00 UTC (10:00 WIB)
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hasil audit hanya fungsi dari pohon dependensi: PR tanpa perubahan dep
  # pasti identik dengan main, jadi scan 4 mnt-nya di-skip. Job ini HANYA
  # jalan di PR (dipakai gerbang audit di bawah); schedule/push/dispatch
  # tidak butuh filter dan auditnya selalu jalan.
  changes:
    name: Deteksi perubahan dependensi
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sama seperti job changes di ci.yml: dangkal 100 cukup untuk
          # merge-base PR; gagal berisik (bukan salah diam-diam) bila kurang.
          fetch-depth: 100

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'security/**'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Monorepo: abaikan kode hasil build & native Android.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  audit:
    name: pnpm audit
    needs: [changes]
    # always() wajib: job changes di-skip pada non-PR, dan tanpa ini audit
    # ikut ter-skip (jadwal Senin ikut mati — justru backstop terpenting).
    # `!= 'false'` (bukan `== 'true'`) sengaja fail-closed: bila filter gagal
    # dan output kosong, audit TETAP jalan daripada lolos diam-diam.
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.deps != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade diri.
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Audit dependensi (gerbang basis-banding)
        # Keadaan nyata (2026-09-01): 8 temuan (6 moderate, 2 high); dua
        # di antaranya (image-size via metro) TANPA patch (patched <0.0.0).
        # Gerbang sengaja TIDAK memakai `|| true` — itu mematikan alarm
        # sepenuhnya (temuan lama maupun baru sama-sama lolos).
        # Skrip ini gagal (exit 1) HANYA bila muncul advisory baru di luar
        # security/audit-baseline.json; --strict juga menggagalkan CI bila
        # ada entri basis yang sudah tidak muncul lagi (mencegah basis
        # menumpuk sampah).
        # Perbarui basis: node scripts/audit-baseline.mjs --update
        run: node scripts/audit-baseline.mjs --strict
