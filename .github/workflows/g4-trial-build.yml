name: "G4 Trial Build (sementara — Opsi A split ABI)"

# SEMENTARA: bukti empiris Gate G4 RENCANA-SPLIT-ABI-OPSI-A-2026-08-26
# tanpa menghabiskan kuota EAS (tertahan s/d 1 Sep 2026).
# Membuktikan: -PabiFilter menghasilkan TEPAT SATU .apk per ABI dengan isi
# lib/ yang benar + ukuran aktual untuk kalibrasi dokumen.
# HAPUS file ini setelah konfirmasi resmi via EAS (post 1 Sep 2026).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-build:
    name: Trial ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Types
        run: pnpm build:shared

      # Signing pakai debug.keystore — G4 hanya mengukur ISI & UKURAN artefak,
      # bukan untuk didistribusikan. Signature produksi tetap milik EAS.
      - name: AssembleRelease (single ABI)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PabiFilter=${{ matrix.abi }} \
            -PreactNativeArchitectures=${{ matrix.abi }} \
            -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android

      - name: Gate G4 — tepat satu artefak .apk (bukan arsip)
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          set -eo pipefail
          echo "=== Daftar output:"
          ls -la
          APK_COUNT=$(find . -maxdepth 1 -name '*.apk' | wc -l)
          ARCHIVE_COUNT=$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          echo "apk=$APK_COUNT archive=$ARCHIVE_COUNT"
          if [ "$APK_COUNT" -ne 1 ] || [ "$ARCHIVE_COUNT" -ne 0 ]; then
            echo "::error::GATE GAGAL — harus tepat 1 .apk dan nol arsip"
            exit 1
          fi

      - name: Gate G4 — isi lib/ positif+negatif per ABI
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          set -eo pipefail
          APK=$(ls *.apk)
          LIBS=$(unzip -l "$APK" | grep -o 'lib/[^/]*/' | sort -u)
          echo "=== Direktori lib/ dalam APK:"
          echo "$LIBS"
          WANT="${{ matrix.abi }}"
          OTHER="armeabi-v7a"; [ "$WANT" = "armeabi-v7a" ] && OTHER="arm64-v8a"
          echo "$LIBS" | grep -q "lib/$WANT/"   || { echo "::error::ABI target $WANT TIDAK ADA"; exit 1; }
          if echo "$LIBS" | grep -q "lib/$OTHER/"; then
            echo "::error::ABI asing $OTHER ikut terbungkus"; exit 1
          fi
          if echo "$LIBS" | grep -qE 'lib/(x86|x86_64)/'; then
            echo "::error::ABI x86/x86_64 bocor"; exit 1
          fi
          echo "✓ Isi lib/ sesuai: hanya $WANT"

      - name: Catat ukuran aktual
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          APK=$(ls *.apk)
          SIZE_MB=$(du -m "$APK" | cut -f1)
          SIZE_B=$(stat -c%s "$APK")
          echo "UKURAN ${SIZE_MB} MB (${SIZE_B} bytes) — abi=${{ matrix.abi }}" | tee ukuran-g4.txt
          {
            echo "### G4 Trial — ${{ matrix.abi }}"
            echo ""
            echo "| Metrik | Nilai |"
            echo "|---|---|"
            echo "| Artefak | \`$APK\` |"
            echo "| Ukuran | ${SIZE_MB} MB (${SIZE_B} bytes) |"
            echo "| ABI gate | lolos (positif+negatif) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefak bukti
        uses: actions/upload-artifact@v4
        with:
          name: g4-${{ matrix.abi }}-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/apk/release/ukuran-g4.txt
          retention-days: 30
