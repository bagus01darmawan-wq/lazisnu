name: CI

# ============================================================================
#  Lazisnu Monorepo — Build, Test & Deploy
#
#  KONTRAK PENTING (jangan diubah tanpa cek):
#  - `release.yml` memanggil: gh workflow run ci.yml --ref <tag> SETELAH APK
#    lolos gate dan URL R2 sehat.
#  - Tag v* SENGAJA tidak menjadi trigger langsung di sini: trigger tag akan
#    melewati fail-closed R2 dan menggandakan deploy.
#  - Deploy production otomatis pada push ke `main` (merge dari staging) DAN
#    manual via workflow_dispatch pada ref `refs/tags/v*` (jalur rilis lama).
#  - Deploy staging otomatis pada push ke branch `staging` (dapur/develop).
#    Model dua jalur: `staging` = dapur (kerja harian, deploy ke env staging),
#    `main` = produksi (hanya menerima merge PR dari staging yang sudah dicek).
#  - Secrets yang dipakai: VM_HOST, VM_USER, VM_SSH_KEY (GITHUB_TOKEN bawaan).
#  - Deploy bergantung pada scripts/deploy-blue-green.sh di dalam repo.
#
#  Perubahan vs versi sebelumnya:
#   1. concurrency → run PR lama dibatalkan (hemat runner); deploy tetap serial.
#   2. timeout-minutes di tiap job → tidak ada job gantung tanpa batas.
#   3. permissions least-privilege (contents:read di level workflow).
#   4. Job verify/test dipisah → gagal lebih cepat & jelas sumber error-nya.
#   5. pnpm store + dependensi di-cache lintas job (setup-node cache: pnpm).
#   6. Token/secret tidak lagi disisipkan langsung ke script shell (env:).
# ============================================================================

on:
  push:
    branches: [main, master, staging]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main, master, staging] # PR ke dapur (staging) juga di-CI
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch: # Dipakai release.yml dan juga bisa dipicu manual

# Batalkan run lama pada PR yang diganti commit baru.
# cancel-in-progress: false untuk main/tag → deploy tidak pernah dibatalkan
# di tengah jalan (menhindari setengah deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  NODE_VERSION: '24'

jobs:
  # ─── Deteksi area yang berubah ────────────────────────────────────────────
  # Supaya perubahan mobile saja tidak memicu build image + deploy backend/web.
  #
  # PENTING — kenapa hasil paths-filter TIDAK dipercaya begitu saja.
  # Pada push berupa MERGE COMMIT, dorny/paths-filter@v4 pernah melaporkan
  # "tidak ada perubahan" padahal push itu membawa 37 berkas. Akibatnya seluruh
  # pipeline ter-skip, termasuk kedua job deploy, sementara run tetap berakhir
  # hijau. Kejadian nyata: merge PR #94 (commit 06da308), 12 Sep 2026.
  # Karena itu langkah `decide` di bawah menghitung ulang diff-nya sendiri dan
  # memaksa semua area berubah bila filter meleset. Arah yang aman adalah
  # kelebihan jalan, bukan diam-diam tidak mengerjakan apa pun.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      web: ${{ steps.decide.outputs.web }}
      mobile: ${{ steps.decide.outputs.mobile }}
      infra: ${{ steps.decide.outputs.infra }}
      # Apakah ada berkas kode yang benar-benar berubah? Dipakai job
      # `ci-status` supaya ia menolak melaporkan hijau ketika seluruh job
      # gerbang ter-skip padahal ada kode yang berubah.
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Dangkal 100, bukan 0: paths-filter hanya butuh merge-base PR
          # (PR di sini divergen <10 commit). Gagal berisik bila kurang —
          # bukan diam-diam salah deteksi. Hemat tumbuh seiring repo menua.
          fetch-depth: 100

      # Base pembanding ditentukan eksplisit supaya langkah `decide` bisa
      # memverifikasi diff-nya sendiri. `github.event.before` kosong pada
      # workflow_dispatch, dan bisa menunjuk commit di luar clone dangkal.
      - name: Tentukan base pembanding
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "value=$PR_BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          b="$BEFORE"
          case "$b" in
            ""|0000000000000000000000000000000000000000) b="" ;;
          esac
          if [ -z "$b" ] || ! git cat-file -e "${b}^{commit}" 2>/dev/null; then
            b="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          echo "value=$b" >> "$GITHUB_OUTPUT"

      - id: filter
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared-types/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared-types/**'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared-types/**'
              - 'pnpm-lock.yaml'
            infra:
              - 'docker-compose*.yml'
              - 'nginx/**'
              - 'prometheus/**'
              - 'scripts/**'
              - '.github/workflows/**'

      # Penentu tunggal area yang berubah — menggantikan langkah `fallback`
      # lama, sekaligus memverifikasi hasil filter terhadap diff yang
      # dihitung sendiri.
      - name: Tentukan area yang berubah
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.value }}
          FILTER: ${{ steps.filter.outcome }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_WEB: ${{ steps.filter.outputs.web }}
          F_MOBILE: ${{ steps.filter.outputs.mobile }}
          F_INFRA: ${{ steps.filter.outputs.infra }}
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          semua_berubah() {
            emit backend true; emit web true; emit mobile true; emit infra true; emit code true
          }

          # Filter tidak dijalankan (workflow_dispatch / ref tag dari
          # release.yml): filter path tidak relevan → jalankan semua.
          if [ "$FILTER" != "success" ] || [ -z "$F_BACKEND" ]; then
            echo "Filter path tidak dijalankan — semua area dianggap berubah."
            semua_berubah
            exit 0
          fi

          # Hitung sendiri diff-nya, untuk memverifikasi hasil filter.
          diff_ok=0
          changed=""
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE" HEAD -- || true)"
            diff_ok=1
          fi

          # Pola di sini sengaja LEBIH LEBAR daripada di paths-filter: langkah
          # ini hanya jaring pengaman. Salah deteksi ke arah "ada kode berubah"
          # hanya membuat pipeline jalan berlebih; ke arah sebaliknya berbahaya.
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              apps/*|packages/*|scripts/*|nginx/*|prometheus/*|.github/workflows/*|docker-compose*.yml|pnpm-lock.yaml|pnpm-workspace.yaml)
                code=true ;;
            esac
          done <<< "$changed"

          if [ "$F_BACKEND" = "false" ] && [ "$F_WEB" = "false" ] && [ "$F_MOBILE" = "false" ] && [ "$F_INFRA" = "false" ]; then
            if [ "$diff_ok" = "0" ]; then
              echo "::warning::Diff tidak bisa diverifikasi (base '$BASE' tidak tersedia di clone). Semua area dipaksa berubah demi keamanan."
              semua_berubah
              exit 0
            fi
            if [ "$code" = "true" ]; then
              echo "::warning::paths-filter melaporkan tidak ada perubahan, tetapi diff $BASE..HEAD memuat berkas kode. Semua area dipaksa berubah demi keamanan."
              semua_berubah
              exit 0
            fi
          fi

          emit backend "$F_BACKEND"
          emit web     "$F_WEB"
          emit mobile  "$F_MOBILE"
          emit infra   "$F_INFRA"
          emit code    "$code"

  # ─── Gerbang mutu: install, build shared types, lint, format, typecheck ───
  # Tidak butuh service (Postgres/Redis) → cepat, dan jadi gate semua job lain.
  verify:
    name: Verify (lint · format · typecheck)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.web    == 'true' ||
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.infra  == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade
          # diri (~3 mnt di runner dingin). Upgrade pnpm = ubah sini + packageManager.
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build shared types
        run: pnpm build:shared

      - name: Lint backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter lazisnu-backend run lint

      - name: Lint web
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter web run lint

      - name: Lint mobile
        if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter lazisnu-collector-app run lint

      - name: Prettier check (mobile)
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm --filter lazisnu-collector-app run format:check

      - name: Typecheck (semua workspace)
        run: pnpm -r exec tsc --noEmit

      - name: Cek migration orphans
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter lazisnu-backend db:check-orphans

  # ─── Test backend (butuh Postgres + Redis) ────────────────────────────────
  test-backend:
    name: Test backend (unit + integration)
    needs: [changes, verify]
    if: >-
      needs.verify.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lazisnu_test_2026
          POSTGRES_DB: lazisnu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:lazisnu_test_2026@localhost:5432/lazisnu_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade
          # diri (~3 mnt di runner dingin). Upgrade pnpm = ubah sini + packageManager.
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build shared types
        run: pnpm build:shared

      - name: Jalankan migrasi di database test
        run: pnpm --filter lazisnu-backend db:migrate

      - name: Unit test
        run: pnpm --filter lazisnu-backend test:unit

      - name: Integration test
        run: pnpm --filter lazisnu-backend test:integration

  # ─── Test mobile ─────────────────────────────────────────────────────────
  test-mobile:
    name: Test mobile
    needs: [changes, verify]
    if: >-
      needs.verify.result == 'success' &&
      (needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade
          # diri (~3 mnt di runner dingin). Upgrade pnpm = ubah sini + packageManager.
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build shared types
        run: pnpm build:shared

      - name: Unit test + coverage
        run: pnpm --filter lazisnu-collector-app run test:coverage

  # ─── Test web ────────────────────────────────────────────────────────────
  test-web:
    name: Test web
    needs: [changes, verify]
    if: >-
      needs.verify.result == 'success' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade
          # diri (~3 mnt di runner dingin). Upgrade pnpm = ubah sini + packageManager.
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build shared types
        run: pnpm build:shared

      - name: Unit test + render test
        run: pnpm --filter web run test

  # ─── Mobile: verifikasi Gradle debug APK ─────────────────────────────────
  build-android-debug:
    name: Build Android Debug (APK verification)
    needs: [changes, verify, test-mobile]
    # Android cukup dibangun bila kode mobile berubah, atau saat rilis
    # (workflow_dispatch dari release.yml). Kategori "infra" sengaja TIDAK
    # lagi memicu job ini: berisi docker-compose/nginx/prometheus/scripts/
    # workflows yang tidak berpengaruh pada hasil assemble Gradle, sehingga
    # mengedit ci.yml atau skrip deploy dulu membuang ~4 menit build Android.
    if: >-
      always() && !cancelled() &&
      needs.verify.result == 'success' &&
      needs.test-mobile.result != 'failure' &&
      (needs.changes.outputs.mobile == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Pin eksak = packageManager di root package.json (pnpm@10.33.2).
          # Tanpa ini action menginstal pnpm latest (v11) lalu downgrade
          # diri (~3 mnt di runner dingin). Upgrade pnpm = ubah sini + packageManager.
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: |
          # Dependabot untuk workspace sub-folder kadang tidak ikut
          # meng-update pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
          # Untuk PR dependabot izinkan lockfile diperbarui otomatis;
          # selain itu tetap enforce --frozen-lockfile.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build shared types
        run: pnpm build:shared

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

  # ─── Build & push image ke GHCR (matrix paralel) ─────────────────────────
  # Tiga image dibangun di runner terpisah secara paralel; dinding ≈ image
  # terlambat (~3 mnt) bukan jumlah ketiganya (~6 mnt). fail-fast default
  # (true) dipertahankan supaya gagal satu = setop, mirip sekuensial dulu.
  # Scope cache GHA dipisah per image agar tulisan paralel tidak saling
  # timpa; baris `type=gha` polos hanya baca cache lama era pra-matrix
  # (transisi hangat, boleh dihapus setelah beberapa minggu).
  build-image:
    name: Build & push Docker images (${{ matrix.name }})
    needs: [changes, verify, test-backend, test-mobile, test-web]
    # always() + !cancelled() supaya job ini tetap dievaluasi meski job test
    # di-skip (mis. hanya mobile yang berubah) — tanpa ini job ikut ter-skip.
    if: >-
      always() && !cancelled() &&
      needs.verify.result == 'success' &&
      needs.test-backend.result != 'failure' &&
      needs.test-mobile.result != 'failure' &&
      needs.test-web.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (needs.changes.outputs.backend == 'true' ||
         needs.changes.outputs.web    == 'true' ||
         needs.changes.outputs.infra  == 'true')))
    strategy:
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            scope: backend
            # CATATAN: konteks `env` tidak tersedia di strategy.matrix
            # (hanya github/inputs/needs/vars). `ghcr.io` = nilai env.REGISTRY
            # dan trailing path = IMAGE_NAME_*; hasilnya identik dengan versi
            # sekuensial. Jangan ganti REGISTRY tanpa ubah sini.
            tags: |
              ghcr.io/${{ github.repository }}/backend:latest
              ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          - name: web-prod
            file: apps/web/Dockerfile
            scope: web-prod
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.lazisnu.site' }}
            tags: |
              ghcr.io/${{ github.repository }}/web:latest
              ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          - name: web-staging
            file: apps/web/Dockerfile
            scope: web-staging
            build_args: |
              NEXT_PUBLIC_API_URL=https://staging-api.lazisnu.site
            tags: |
              ghcr.io/${{ github.repository }}/web:staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login ke GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.tags }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.scope }}
            type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # ─── Deploy PRODUCTION (push ke main ATAU dispatch release tag v*) ───────
  deploy:
    name: Deploy production
    needs: [changes, verify, test-backend, test-mobile, test-web, build-image]
    if: >-
      always() && !cancelled() &&
      needs.build-image.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' &&
        (needs.changes.outputs.backend == 'true' ||
         needs.changes.outputs.web    == 'true' ||
         needs.changes.outputs.infra  == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    # Serialkan deploy: dua rilis berurutan tidak boleh saling tabrak.
    concurrency:
      group: lazisnu-deploy-prod
      cancel-in-progress: false
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      GHCR_REPO: ${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy ke VM via SSH (blue-green)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          # PENTING: appleboy/ssh-action TIDAK mewarisi env runner ke shell
          # remote. Tanpa `envs`, $GHCR_TOKEN / $IMAGE_TAG akan kosong di VM.
          envs: GHCR_TOKEN,GHCR_USER,GHCR_REPO,IMAGE_TAG
          script: |
            set -eo pipefail
            cd /opt/lazisnu

            # Backup .env files — amankan kalau ada sisa conflict merge
            if [ -f apps/backend/.env ]; then
              cp apps/backend/.env /tmp/.env.deploy.bak
            fi
            if [ -f apps/backend/.env.staging ]; then
              cp apps/backend/.env.staging /tmp/.env.staging.deploy.bak
            fi

            # Sinkronkan repo — reset --hard tidak sentuh untracked files
            git fetch origin --tags
            git reset --hard $IMAGE_TAG
            echo "✓ Repository updated to $IMAGE_TAG"

            # Restore .env dari backup (safety net)
            if [ -f /tmp/.env.deploy.bak ]; then
              mv /tmp/.env.deploy.bak apps/backend/.env
            fi
            if [ -f /tmp/.env.staging.deploy.bak ]; then
              mv /tmp/.env.staging.deploy.bak apps/backend/.env.staging
            fi

            # Verifikasi kode di VM benar-benar berada di commit yang diminta.
            # Tanpa ini, deploy bisa saja berjalan memakai sisa kode lama
            # tanpa ada yang tahu.
            VM_SHA=$(git rev-parse HEAD)
            if [ "$VM_SHA" != "$IMAGE_TAG" ]; then
              echo "❌ Kode di VM ($VM_SHA) bukan commit yang diminta ($IMAGE_TAG)"
              exit 1
            fi
            echo "✓ Kode terverifikasi di commit $VM_SHA"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Catat warna yang sedang live SEBELUM deploy. Dipakai untuk
            # rollback bila verifikasi di bawah gagal, dan untuk teardown
            # setelah verifikasi lolos.
            PREV_COLOR=$(bash scripts/deploy-blue-green.sh active)
            echo "Warna live sebelum deploy: ${PREV_COLOR:-tidak ada}"

            # KEEP_OLD_COLOR=1 — BUKAN AUTO_TEARDOWN=1.
            # Dulu warna lama dibongkar di titik ini, sehingga saat health
            # check publik di bawah gagal, skrip rollback menolak jalan karena
            # warna lama sudah mati. Rollback jadi mustahil — persis yang
            # terjadi pada run 33348805795. Sekarang warna lama dibiarkan
            # hidup sampai verifikasi publik benar-benar lolos.
            GHCR_REPO=$GHCR_REPO IMAGE_TAG=$IMAGE_TAG KEEP_OLD_COLOR=1 \
              bash scripts/deploy-blue-green.sh deploy

            # ─── Verifikasi lewat domain publik ──────────────────────────
            # Warna lama masih hidup di sini, jadi rollback benar-benar bisa
            # jalan. Jangan akhiri pemanggilan rollback dengan `|| true`:
            # kalau rollback ikut gagal, produksi butuh penanganan manual dan
            # itu harus terlihat jelas di log.
            gagal() {
              echo "❌ $1"
              if ! bash scripts/deploy-blue-green.sh rollback; then
                echo "❌ Rollback GAGAL — produksi butuh penanganan manual SEKARANG"
              fi
              exit 1
            }

            # 1. Backend siap — cek isi respons, bukan sekadar HTTP 200.
            #    /health/ready mengembalikan 503 kalau DB atau Redis mati.
            if ! curl -sf https://api.lazisnu.site/health/ready | grep -q '"status":"ready"'; then
              gagal "Backend /health/ready tidak ready (DB atau Redis bermasalah)"
            fi
            echo "✅ Backend ready — DB dan Redis ok"

            # 2. Web
            if ! curl -sf https://dashboard.lazisnu.site/api/health | grep -q '"status":"ok"'; then
              gagal "Web /api/health tidak ok"
            fi
            echo "✅ Web healthy"

            # 3. Lapis autentikasi hidup dan masih menolak permintaan tanpa
            #    token. Harus 401 — kalau 500, berarti verifikasi JWT rusak.
            AUTH_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://api.lazisnu.site/v1/auth/me)
            if [ "$AUTH_CODE" != "401" ]; then
              gagal "GET /v1/auth/me tanpa token mengembalikan $AUTH_CODE, seharusnya 401"
            fi
            echo "✅ Autentikasi menolak permintaan tanpa token (401)"

            # ─── Verifikasi lolos — warna lama aman dibongkar ────────────
            # Perintah teardown menolak membongkar warna yang sedang live,
            # jadi salah hitung warna tidak akan mematikan produksi.
            if [ -n "$PREV_COLOR" ]; then
              bash scripts/deploy-blue-green.sh teardown "$PREV_COLOR" \
                || echo "⚠️  Teardown $PREV_COLOR gagal — tidak fatal, warna baru sudah live"
            fi

            # Housekeeping: image lama/dangling dibersihkan (yang berjalan aman)
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -f >/dev/null 2>&1 || true

  # ─── Deploy STAGING (dapur) — push ke branch `staging` ───────────────────
  deploy-staging:
    name: Deploy staging
    needs: [changes, verify, test-backend, test-mobile, test-web, build-image]
    if: >-
      always() && !cancelled() &&
      needs.build-image.result == 'success' &&
      github.ref == 'refs/heads/staging' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.web    == 'true' ||
       needs.changes.outputs.infra  == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: lazisnu-deploy-staging
      cancel-in-progress: false
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      GHCR_REPO: ${{ github.repository }}
      GIT_REF: ${{ github.ref_name }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy staging ke VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          # Lihat catatan `envs` di job deploy production.
          envs: GHCR_TOKEN,GHCR_USER,GHCR_REPO,GIT_REF
          script: |
            set -e
            cd /opt/lazisnu

            # Backup .env files — amankan kalau ada sisa conflict merge
            if [ -f apps/backend/.env.staging ]; then
              cp apps/backend/.env.staging /tmp/.env.staging.deploy.bak
            fi
            if [ -f apps/backend/.env ]; then
              cp apps/backend/.env /tmp/.env.deploy.bak
            fi

            # Sinkronkan repo ke ref yang di-deploy (branch staging) —
            # reset --hard tidak sentuh untracked files
            git fetch origin
            git reset --hard "origin/$GIT_REF"
            echo "✓ Repository synchronized ke origin/$GIT_REF"

            # Restore .env dari backup (safety net)
            if [ -f /tmp/.env.staging.deploy.bak ]; then
              mv /tmp/.env.staging.deploy.bak apps/backend/.env.staging
            fi
            if [ -f /tmp/.env.deploy.bak ]; then
              mv /tmp/.env.deploy.bak apps/backend/.env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull ghcr.io/$GHCR_REPO/backend:latest
            docker pull ghcr.io/$GHCR_REPO/web:latest
            docker pull ghcr.io/$GHCR_REPO/web:staging

            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d

            # Reload nginx: container staging baru = IP baru (nginx cache DNS)
            docker exec lazisnu-nginx-1 nginx -s reload || true

            # Smoke test via URL publik + retry (cold start Next.js bisa >10s)
            ok=0
            i=0
            while [ $i -lt 12 ]; do
              if curl -sf https://staging-api.lazisnu.site/health >/dev/null && curl -sf https://staging.lazisnu.site >/dev/null; then
                ok=1; break
              fi
              i=$((i+1))
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "✅ Staging healthy"; else echo "❌ Staging DOWN"; exit 1; fi

            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -f >/dev/null 2>&1 || true

  # ─── Ringkasan status (memudahkan baca hasil di tab Actions) ─────────────
  # Job ini adalah SATU-SATUNYA status yang diwajibkan branch protection
  # `main`. Karena itu ia tidak boleh pernah melaporkan hijau untuk pipeline
  # yang sebenarnya tidak mengerjakan apa pun. Dulu ia hanya memeriksa
  # `failure`, sehingga `skipped` dianggap lolos — dan merge PR #94 (12 Sep
  # 2026) lolos hijau padahal 8 dari 10 job ter-skip dan tidak ada deploy.
  ci-status:
    name: CI status
    needs: [changes, verify, test-backend, test-mobile, test-web, build-image]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluasi hasil
        env:
          R_CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          R_VERIFY: ${{ needs.verify.result }}
          R_TEST_BACKEND: ${{ needs.test-backend.result }}
          R_TEST_MOBILE: ${{ needs.test-mobile.result }}
          R_TEST_WEB: ${{ needs.test-web.result }}
          R_BUILD_IMAGE: ${{ needs.build-image.result }}
        run: |
          set -euo pipefail
          echo "changes       : $R_CHANGES (ada kode berubah: ${CODE_CHANGED:-tidak diketahui})"
          echo "verify        : $R_VERIFY"
          echo "test-backend  : $R_TEST_BACKEND"
          echo "test-mobile   : $R_TEST_MOBILE"
          echo "test-web      : $R_TEST_WEB"
          echo "build-image   : $R_BUILD_IMAGE"

          gagal=0

          for r in "$R_VERIFY" "$R_TEST_BACKEND" "$R_TEST_MOBILE" "$R_TEST_WEB" "$R_BUILD_IMAGE"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              gagal=1
            fi
          done

          # Job `changes` gagal → semua job hilir ter-skip, jadi hasilnya tidak
          # bisa dinilai. Jangan pernah melaporkan hijau dalam keadaan ini.
          if [ "$R_CHANGES" != "success" ]; then
            echo "::error::Job changes berakhir '$R_CHANGES' — pipeline tidak bisa dinilai."
            gagal=1
          fi

          # Penjaga hijau palsu: ada kode yang berubah, tetapi tidak satu pun
          # job gerbang benar-benar dijalankan.
          if [ "$CODE_CHANGED" = "true" ] &&
             [ "$R_VERIFY" = "skipped" ] && [ "$R_TEST_BACKEND" = "skipped" ] &&
             [ "$R_TEST_MOBILE" = "skipped" ] && [ "$R_TEST_WEB" = "skipped" ] &&
             [ "$R_BUILD_IMAGE" = "skipped" ]; then
            echo "::error::Kode berubah tetapi SELURUH job gerbang ter-skip. Deteksi area kemungkinan salah — pipeline tidak boleh dilaporkan hijau."
            gagal=1
          fi

          if [ "$gagal" = "1" ]; then
            echo "::error::Pipeline tidak lolos."
            exit 1
          fi

          echo "✅ Semua job relevan lolos."
