name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger untuk deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_WEB: ${{ github.repository }}/web

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Shared Types (Wajib untuk Monorepo)
      run: pnpm build:shared

    - name: Check migration orphans
      run: pnpm --filter lazisnu-backend db:check-orphans

    - name: Run lint
      run: pnpm -r --no-bail run lint

    - name: Run type check
      run: pnpm -r exec tsc --noEmit

    - name: Run unit tests
      run: |
        pnpm --filter lazisnu-backend test:unit
        pnpm --filter lazisnu-collector-app test

  # ─── 07-B2-1: Build & Push Docker Images ke GHCR ───
  build-image:
    needs: lint-and-typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/backend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push Web Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.lazisnu.site' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ─── 07-B2-2: Deploy ke Production (Manual via tag v*) ───
  deploy:
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/lazisnu

          # Login ke GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull images terbaru (pakai tag SHA)
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}

          # Tag ulang sebagai latest dan restart services
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest

          # Restart services (production compose)
          docker compose down
          docker compose up -d

          # Health check
          sleep 10
          curl -sf http://localhost:3001/health && echo "✅ Backend healthy" || echo "❌ Backend DOWN"
          curl -sf http://localhost:3000 && echo "✅ Web healthy" || echo "❌ Web DOWN"

  # ─── 07-E3-4: Deploy ke Staging (auto dari push main) ───
  deploy-staging:
    needs: build-image
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy Staging to VM via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/lazisnu

          # Login ke GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull images terbaru
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest

          # Deploy staging
          docker compose -f docker-compose.staging.yml down
          docker compose -f docker-compose.staging.yml up -d

          # Smoke test (07-E3-5)
          sleep 10
          curl -sf http://localhost:4001/health && echo "✅ Staging Backend healthy" || echo "❌ Staging Backend DOWN"
          curl -sf http://localhost:4000 && echo "✅ Staging Web healthy" || echo "❌ Staging Web DOWN"
