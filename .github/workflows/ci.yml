name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger untuk deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_WEB: ${{ github.repository }}/web

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    # Postgres service untuk test integrasi (kredensial match apps/backend/.env.test)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lazisnu_test_2026
          POSTGRES_DB: lazisnu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      
    - name: Install pnpm
      uses: pnpm/action-setup@v5.0.0
        
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Shared Types (Wajib untuk Monorepo)
      run: pnpm build:shared

    - name: Check migration orphans
      run: pnpm --filter lazisnu-backend db:check-orphans

    - name: Run lint
      run: pnpm -r --no-bail run lint

    - name: Run type check
      run: pnpm -r exec tsc --noEmit

    - name: Run DB migrations di test database
      run: pnpm --filter lazisnu-backend db:migrate
      env:
        DATABASE_URL: postgresql://postgres:lazisnu_test_2026@localhost:5432/lazisnu_test

    - name: Run unit tests
      run: |
        pnpm --filter lazisnu-backend test:unit
        pnpm --filter lazisnu-collector-app test

  # ─── 07-B2-1: Build & Push Docker Images ke GHCR ───
  build-image:
    needs: lint-and-typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/backend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push Web Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.lazisnu.site' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ─── 07-B2-2: Deploy ke Production (tag v*) — blue-green (08-C3, zero downtime) ───
  deploy:
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Deploy to VM via SSH (blue-green)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -eo pipefail
          cd /opt/lazisnu

          # Sinkronkan source ke versi tag (ops lokal di-stash agar tidak konflik)
          git stash push -m "pre-deploy $(date -Iseconds)" || true
          git fetch origin --tags
          git checkout -f ${{ github.sha }}
          echo "✓ Repository updated to ${{ github.sha }}"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Deploy blue-green tanpa downtime (pull image baru, smoke test, switch nginx, teardown warna lama)
          GHCR_REPO=${{ github.repository }} \
          IMAGE_TAG=${{ github.sha }} \
          AUTO_TEARDOWN=1 \
            bash scripts/deploy-blue-green.sh deploy

          # Health check publik
          curl -sf https://api.lazisnu.site/health/ready && echo "✅ Backend healthy" || { echo "❌ Backend DOWN"; exit 1; }
          curl -sf https://dashboard.lazisnu.site && echo "✅ Web healthy" || { echo "❌ Web DOWN"; exit 1; }

  # ─── 07-E3-4: Deploy ke Staging (auto dari push main) ───
  deploy-staging:
    needs: build-image
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Deploy Staging to VM via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -e
          cd /opt/lazisnu

          # Sinkronkan source ke main terbaru (ops lokal di-stash agar tidak konflik)
          git stash push -m "pre-staging-deploy $(date -Iseconds)" || true
          git fetch origin
          git checkout -f origin/main
          echo "✓ Repository updated"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest

          # Deploy staging
          docker compose -f docker-compose.staging.yml down
          docker compose -f docker-compose.staging.yml up -d

          # Reload nginx: muat nginx.conf terbaru dari checkout + re-resolve upstream
          # (container staging baru = IP baru; nginx cache DNS saat startup)
          docker exec lazisnu-nginx-1 nginx -s reload || true

          # Smoke test (07-E3-5): lewat URL publik (end-to-end via nginx)
          # + retry loop — cold start Next.js bisa >10 detik
          ok=0
          i=0
          while [ $i -lt 12 ]; do
            if curl -sf https://staging-api.lazisnu.site/health >/dev/null && curl -sf https://staging.lazisnu.site >/dev/null; then ok=1; break; fi
            i=$((i+1))
            sleep 5
          done
          if [ "$ok" = "1" ]; then echo "✅ Staging healthy"; else echo "❌ Staging DOWN"; exit 1; fi
