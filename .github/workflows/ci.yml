name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore: ['docs/**', '*.md']  # docs-only → skip workflow
  pull_request:
    branches: [ main, master ]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:  # Manual trigger untuk deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_WEB: ${{ github.repository }}/web

jobs:
  # ─── Deteksi area perubahan (path filter) ────────────────────────────────
  # CI penuh (build image + deploy) hanya jika backend/web/infra berubah.
  # Perubahan mobile/docs → hanya test mobile (cepat); tag/dispatch → full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.filter-manual.outputs.backend }}
      web: ${{ steps.filter.outputs.web || steps.filter-manual.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile || steps.filter-manual.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra || steps.filter-manual.outputs.infra }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - id: filter
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: dorny/paths-filter@v4
      with:
        filters: |
          backend:
            - 'apps/backend/**'
            - 'packages/shared-types/**'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
          web:
            - 'apps/web/**'
          mobile:
            - 'apps/mobile/**'
          infra:
            - 'docker-compose*.yml'
            - 'nginx/**'
            - 'prometheus/**'
            - 'scripts/**'
            - '.github/workflows/**'

    # Tag push / workflow_dispatch: path filter tidak relevan → CI penuh
    - id: filter-manual
      if: steps.filter.outputs.backend == ''
      run: |
        echo "backend=true" >> "$GITHUB_OUTPUT"
        echo "web=true" >> "$GITHUB_OUTPUT"
        echo "mobile=true" >> "$GITHUB_OUTPUT"
        echo "infra=true" >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    # Postgres service untuk test integrasi (kredensial match apps/backend/.env.test)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lazisnu_test_2026
          POSTGRES_DB: lazisnu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Shared Types (Wajib untuk Monorepo)
      run: pnpm build:shared

    - name: Check migration orphans
      if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
      run: pnpm --filter lazisnu-backend db:check-orphans

    - name: Run lint
      if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true'
      run: pnpm -r --no-bail run lint

    - name: Check code formatting (Prettier)
      if: needs.changes.outputs.mobile == 'true'
      run: pnpm --filter lazisnu-collector-app run format:check

    - name: Run type check
      if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true'
      run: pnpm -r exec tsc --noEmit

    - name: Run DB migrations di test database
      if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
      run: pnpm --filter lazisnu-backend db:migrate
      env:
        DATABASE_URL: postgresql://postgres:lazisnu_test_2026@localhost:5432/lazisnu_test

    - name: Run unit tests
      run: |
        if [ "${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}" = "true" ]; then
          pnpm --filter lazisnu-backend test:unit
        fi
        if [ "${{ needs.changes.outputs.mobile == 'true' }}" = "true" ]; then
          pnpm --filter lazisnu-collector-app run test:coverage
        fi

    - name: Run integration tests
      if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
      run: pnpm --filter lazisnu-backend test:integration
      env:
        DATABASE_URL: postgresql://postgres:lazisnu_test_2026@localhost:5432/lazisnu_test
        REDIS_URL: redis://localhost:6379

  # ─── Mobile: Build Android Debug APK (05-CI) ───
  build-android-debug:
    name: Build Android Debug (APK Verification)
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Setup Java JDK (Java 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Shared Types
      run: pnpm build:shared

    - name: Build Android Debug APK
      working-directory: apps/mobile/android
      run: ./gradlew assembleDebug --no-daemon

  # ─── 07-B2-1: Build & Push Docker Images ke GHCR ───
  build-image:
    needs: [lint-and-typecheck, changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build & Push Backend Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/backend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push Web Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.lazisnu.site' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push Web Image (Staging)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=https://staging-api.lazisnu.site
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:staging
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ─── 07-B2-2: Deploy ke Production (tag v*) — blue-green (08-C3, zero downtime) ───
  deploy:
    needs: [lint-and-typecheck, build-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Deploy to VM via SSH (blue-green)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -eo pipefail
          cd /opt/lazisnu

          # Sinkronkan source ke versi tag (ops lokal di-stash agar tidak konflik)
          git stash push -m "pre-deploy $(date -Iseconds)" || true
          git fetch origin --tags
          git checkout -f ${{ github.sha }}
          echo "✓ Repository updated to ${{ github.sha }}"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Deploy blue-green tanpa downtime (pull image baru, smoke test, switch nginx, teardown warna lama)
          GHCR_REPO=${{ github.repository }} \
          IMAGE_TAG=${{ github.sha }} \
          AUTO_TEARDOWN=1 \
            bash scripts/deploy-blue-green.sh deploy

          # Health check publik
          curl -sf https://api.lazisnu.site/health/ready && echo "✅ Backend healthy" || { echo "❌ Backend DOWN"; exit 1; }
          curl -sf https://dashboard.lazisnu.site && echo "✅ Web healthy" || { echo "❌ Web DOWN"; exit 1; }

          # Housekeeping otomatis: hapus image unused/dangling pasca deploy
          # (image container yang berjalan otomatis dilindungi; digest lama + lokal legacy dibersihkan)
          docker image prune -af >/dev/null 2>&1 || true
          docker builder prune -f >/dev/null 2>&1 || true

  # ─── 07-E3-4: Deploy ke Staging (auto dari push main) ───
  deploy-staging:
    needs: [lint-and-typecheck, build-image, changes]
    if: >
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Deploy Staging to VM via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -e
          cd /opt/lazisnu

          # Sinkronkan source ke main terbaru (ops lokal di-stash agar tidak konflik)
          git stash push -m "pre-staging-deploy $(date -Iseconds)" || true
          git fetch origin
          git checkout -f origin/main
          echo "✓ Repository updated"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:staging

          # Deploy staging
          docker compose -f docker-compose.staging.yml down
          docker compose -f docker-compose.staging.yml up -d

          # Reload nginx: muat nginx.conf terbaru dari checkout + re-resolve upstream
          # (container staging baru = IP baru; nginx cache DNS saat startup)
          docker exec lazisnu-nginx-1 nginx -s reload || true

          # Smoke test (07-E3-5): lewat URL publik (end-to-end via nginx)
          # + retry loop — cold start Next.js bisa >10 detik
          ok=0
          i=0
          while [ $i -lt 12 ]; do
            if curl -sf https://staging-api.lazisnu.site/health >/dev/null && curl -sf https://staging.lazisnu.site >/dev/null; then ok=1; break; fi
            i=$((i+1))
            sleep 5
          done
          if [ "$ok" = "1" ]; then echo "✅ Staging healthy"; else echo "❌ Staging DOWN"; exit 1; fi

          # Housekeeping otomatis: hapus image unused/dangling pasca deploy staging
          docker image prune -af >/dev/null 2>&1 || true
          docker builder prune -f >/dev/null 2>&1 || true
