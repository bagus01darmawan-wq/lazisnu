groups:
  - name: lazisnu-backend
    interval: 15s
    rules:

      # ──────────────────────────────────────────
      # CPU backend > 70% dari 4 inti VM selama 5 menit — alarm P1
      # (keputusan P1 rencana trustProxy 1 Nov 2026: prasyarat tahap 3,
      # batas 200/menit per IP + pemutus arus 3.000/menit).
      # Metric: process_cpu_seconds_total — rate-nya = inti terpakai (fraksi
      # per proses, 1.0 = satu inti penuh). Dibagi 4 (jumlah inti VM) agar
      # ambang 70 berarti 70% kapasitas MESIN, bukan 70% satu inti — kalau
      # dipasang mentah "> 70" (=0,7 inti), alarm akan berbunyi terus pada
      # beban penuh perkiraan 3.000/menit yang hanya ~0,8 inti (20% mesin).
      # Perkiraan puncak terukur: 0,8 inti ≈ 20% — alarm baru berbunyi saat
      # backend memakan 2,8 inti (3,5× puncak perkiraan).
      # ──────────────────────────────────────────
      - alert: HighCpuUsage
        expr: sum(rate(process_cpu_seconds_total{job="lazisnu-backend"}[1m])) / 4 * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU backend tinggi ({{ $value | printf \"%.1f\" }}% dari 4 inti)"
          description: >
            Backend Lazisnu memakai lebih dari 70% kapasitas CPU VM (4 inti)
            selama 5 menit — alarm P1, prasyarat tahap 3. Perkiraan beban penuh
            batas 3.000/menit hanya ~20%; bila ini terpicu, ada beban di luar
            model. Cek: docker stats, log backend, query lambat Supabase.

      # ──────────────────────────────────────────
      # Latensi p95 > 500ms selama 5 menit — alarm P1 (pasangan HighCpuUsage)
      # Metric: http_request_duration_ms_bucket — histogram prom-client, unit
      # MILLISEKONDI, label le/method/route/statusCode (terverifikasi di
      # blue-backend:3001/metrics). p95 dihitung agregat kedua warna
      # blue-green (sum by le); warna idle menyumbang rate 0.
      # Baseline terukur 1 Nov 2026: p95 143ms (jendela 30 m), 48ms (5 m) pada
      # beban rendah. Antrean database/pool muncul SEBELUM 429 — gejalanya
      # latensi naik, bukan penolakan; itulah yang alarm ini tangkap.
      # ──────────────────────────────────────────
      - alert: BackendLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket{job="lazisnu-backend"}[5m]))) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latensi p95 backend tinggi ({{ $value | printf \"%.0f\" }}ms)"
          description: >
            Latensi p95 backend Lazisnu melebihi 500ms selama 5 menit — alarm
            P1, prasyarat tahap 3. Dugaan utama: antrean di database/pool
            Supabase (transaction mode, SELECT 1 ≈ 82ms) atau CPU. Cek: Grafana
            overview, docker logs, Supabase observability.

      # ──────────────────────────────────────────
      # Memory (Heap) > ~85% dari heap_size_limit
      # 2026-08-08: rumus lama used/total dihapus karena false positive —
      # nodejs_heap_size_total_bytes = heap yang sedang di-commit V8 (bukan limit),
      # sehingga rasio used/total hampir selalu 75-90% meski heap sehat.
      # Dipakai ambang absolut: heap_size_limit V8 = ~2052MB, 85% ≈ 1700MB.
      # Metric: nodejs_heap_size_used_bytes (prom-client default)
      # ──────────────────────────────────────────
      - alert: HighHeapMemoryUsage
        expr: nodejs_heap_size_used_bytes{job="lazisnu-backend"} > 1700e6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap memory tinggi ({{ $value | humanize1024 }})"
          description: >
            Heap memory backend Lazisnu melebihi ~85% dari heap_size_limit
            (~2GB) selama 5 menit. Pertimbangkan restart atau investigasi
            memory leak. Instance: {{ $labels.instance }}

      # ──────────────────────────────────────────
      # HTTP error rate > 5% dalam 5 menit terakhir
      # Metric: http_request_duration_seconds_count (label: status_code)
      # Fallback: process_resident_memory_bytes sebagai proxy jika HTTP metric tidak ada
      # Catatan: prom-client collectDefaultMetrics() tidak expose HTTP req metric secara default.
      # Jika backend tidak menambah custom HTTP counter, rule ini akan tetap inactive (tidak firing).
      # Uncomment dan sesuaikan jika custom metric http_requests_total ditambahkan.
      # ──────────────────────────────────────────
      - alert: HighHttpErrorRate
        expr: >
          (
            sum(rate(http_request_duration_ms_count{job="lazisnu-backend", statusCode=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_ms_count{job="lazisnu-backend"}[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP error rate tinggi ({{ $value | printf \"%.1f\" }}%)"
          description: >
            Lebih dari 5% request ke backend Lazisnu mengembalikan error 5xx
            dalam 5 menit terakhir.
            Instance: {{ $labels.instance }}

      # ──────────────────────────────────────────
      # Event Loop Lag > 100ms
      # Metric: nodejs_eventloop_lag_seconds (prom-client default)
      # ──────────────────────────────────────────
      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds{job="lazisnu-backend"} * 1000 > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag tinggi ({{ $value | printf \"%.0f\" }}ms)"
          description: >
            Event loop backend Lazisnu mengalami lag lebih dari 100ms selama 2 menit.
            Kemungkinan penyebab: blocking I/O, query lambat, atau CPU spike.
            Instance: {{ $labels.instance }}

      # ──────────────────────────────────────────
      # Backend Down — SEMUA target backend tidak merespons (up == 0)
      # Blue-green: satu warna idle sengaja down (tidak di-scrape) → rule ini
      # hanya firing jika kedua target (blue + green) down sekaligus.
      # ──────────────────────────────────────────
      - alert: BackendDown
        expr: sum(up{job="lazisnu-backend"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend Lazisnu tidak merespons"
          description: >
            Semua target backend (blue-backend:3001 + green-backend:3101) tidak
            bisa di-scrape selama lebih dari 1 menit.
            Cek: docker ps, docker logs blue-backend / green-backend

      # ──────────────────────────────────────────
      # Lonjakan refresh token ditolak (401) — indikasi sesi di-revoke,
      # rotasi token ganda (multi-tab), atau secret tidak konsisten.
      # Ambang: >6 kejadian per 5 menit (≈0.02 rps) selama 3 menit.
      # Metric: http_requests_total (custom backend, label route+statusCode).
      # ──────────────────────────────────────────
      - alert: AuthRefreshFailureRate
        expr: rate(http_requests_total{route="/v1/auth/refresh",statusCode="401"}[5m]) > 0.02
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Lonjakan refresh token ditolak ({{ $value | printf \"%.3f\" }} rps)"
          description: >
            Refresh token ditolak 401 di atas ambang normal. Penyebab umum:
            sesi di-revoke (login perangkat lain), rotasi token ganda antar
            tab, atau secret JWT tidak konsisten.
            Cek log backend: docker logs blue-backend | grep auth_refresh_failed
