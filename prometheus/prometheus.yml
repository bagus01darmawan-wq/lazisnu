# Prometheus Configuration — Lazisnu
# Scrape interval: 15 detik (sesuai spec 08-A1)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - "alert.rules.yml"

# Alertmanager (opsional — aktifkan jika ingin notifikasi via Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Lazisnu Backend — production aktif (green) di port 3101.
  # Target base backend:3001 dihapus karena container lazisnu-backend-1 tidak ada lagi.
  - job_name: "lazisnu-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["green-backend:3101"]
