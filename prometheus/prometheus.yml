# Prometheus Configuration — Lazisnu
# Scrape interval: 15 detik (sesuai spec 08-A1)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - "alert.rules.yml"

# Alertmanager — notifikasi alert ke Discord (channel khusus Prometheus).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Lazisnu Backend — blue-green production. Dua target (blue + green) dipasang
  # sekaligus agar selalu ada warna yang ter-scrape: deploy-blue-green.sh hanya
  # menulis ulang nginx/upstream.conf, TIDAK menyentuh prometheus.yml. Target
  # warna yang sedang idle akan down (normal, non-fatal) dan up kembali saat
  # warnanya di-switch. (Perbaikan 2026-08-07: sebelumnya hanya green-backend:3101
  # yang dipasang → saat blue aktif, monitoring backend kosong.)
  - job_name: "lazisnu-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["blue-backend:3001", "green-backend:3101"]
