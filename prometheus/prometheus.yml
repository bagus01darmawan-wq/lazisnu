# Prometheus Configuration — Lazisnu
# Scrape interval: 15 detik (sesuai spec 08-A1)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - "alert.rules.yml"

# Alertmanager (opsional — aktifkan jika ingin notifikasi via Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Lazisnu Backend
  # Scrape blue (port 3001) + green (port 3101) — saat blue-green deploy,
  # kedua container running sampai teardown. Setelah blue di-teardown,
  # target blue jadi down dan Prometheus berhenti scrape otomatis.
  - job_name: "lazisnu-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]        # blue (lazisnu-backend-1)
      - targets: ["green-backend:3101"]  # green (blue-green deploy)
