# Redis configuration for Lazisnu production
# AOF + RDB persistence

# AOF — catat setiap operasi tulis
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot
save 300 1
save 60 10

# Memory
maxmemory 100mb
maxmemory-policy volatile-lru

# Network
protected-mode no
bind 0.0.0.0
port 6379

# Data dir
dir /data
