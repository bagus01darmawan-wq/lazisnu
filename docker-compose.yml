services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"  # redis user default di redis:7-alpine (lihat scripts/fix-volume-ownership.sh)
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - BACKUP_FLAG_PATH=/app/backup-data/active
    volumes:
      - ./backup-data:/app/backup-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["node", "apps/backend/dist/worker.js"]
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    user: "65534:65534"  # nobody user default di prom/prometheus (lihat scripts/fix-volume-ownership.sh)
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    user: "472:472"  # grafana user default di grafana/grafana (lihat scripts/fix-volume-ownership.sh)
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://backend:3001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/upstream.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Uptime Kuma — self-hosted monitoring (Lapis 3, Sesi 31)
  # Bind mount data ke host untuk backup langsung (lihat scripts/backup-kuma.sh)
  # Port 127.0.0.1 only — akses via SSH tunnel atau nginx reverse proxy (Lapis 4b)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    # JANGAN set `user:` — image ini startup chown ke node:node (butuh root/
    # CAP_CHOWN). Default root; data bind-mount di-chown sendiri ke 1000:1000.
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - ./uptime-kuma/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # Image TIDAK punya wget — pakai curl (tersedia di /usr/bin/curl)
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
