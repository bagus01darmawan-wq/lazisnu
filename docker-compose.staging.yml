# ============================================
# Lazisnu Staging Environment
# ============================================
# Network: bergabung dengan lazisnu_default (dari docker-compose.yml)
# sehingga nginx production bisa proxy ke staging container.
#
# Jalankan: docker compose -f docker-compose.staging.yml up -d
# ============================================

networks:
  lazisnu_default:
    external: true

services:
  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"  # redis user default di redis:7-alpine (lihat scripts/fix-volume-ownership.sh)
    command: redis-server --protected-mode no --appendonly yes --appendfsync everysec --save 300 1 --save 60 10 --maxmemory 50mb --maxmemory-policy volatile-lru
    volumes:
      - ./redis-data-staging:/data
    networks: [lazisnu_default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-staging:
    image: ghcr.io/bagus01darmawan-wq/lazisnu/backend:latest
    restart: unless-stopped
    depends_on:
      redis-staging:
        condition: service_healthy
    networks: [lazisnu_default]
    env_file:
      - apps/backend/.env.staging
    environment:
      - NODE_ENV=production
      - PORT=4001
      - REDIS_URL=redis://redis-staging:6379
      - NODE_OPTIONS=--dns-result-order=ipv4first
    # CMD dari Dockerfile: node apps/backend/dist/index.js — jangan override
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker-staging:
    image: ghcr.io/bagus01darmawan-wq/lazisnu/backend:latest
    restart: unless-stopped
    depends_on:
      redis-staging:
        condition: service_healthy
    networks: [lazisnu_default]
    entrypoint: ["node", "apps/backend/dist/worker.js"]
    env_file:
      - apps/backend/.env.staging
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis-staging:6379
      - NODE_OPTIONS=--dns-result-order=ipv4first
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-staging:
    image: ghcr.io/bagus01darmawan-wq/lazisnu/web:staging
    restart: unless-stopped
    networks: [lazisnu_default]
    env_file:
      - apps/backend/.env.staging
    environment:
      - NODE_ENV=production
      - PORT=4000
      - API_URL=http://backend-staging:4001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
