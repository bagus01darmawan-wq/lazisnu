# Production Compose — menggunakan pre-built images dari GHCR.
# Dipakai oleh CI deploy job. Tidak melakukan `build:` dari source.
#
# Usage di VM:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"  # redis user default di redis:7-alpine (lihat scripts/fix-volume-ownership.sh)
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/lazisnu/backend:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/lazisnu/backend:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["node", "apps/backend/dist/worker.js"]
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/lazisnu/web:latest
    restart: unless-stopped
    env_file:
      - apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://backend:3001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
