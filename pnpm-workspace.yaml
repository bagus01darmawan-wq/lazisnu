packages:
  - 'apps/*'
  - 'packages/*'

# Overrides dipindah dari package.json field "pnpm" (diabaikan sejak pnpm 10,
# dihapus di pnpm 11). Di sini pin diterapkan aktif oleh pnpm 10+.
overrides:
  '@types/react': 18.2.79
  'shell-quote': 1.9.0
  'joi': 17.13.4
  '@babel/plugin-transform-modules-systemjs': 7.29.7
  '@typescript-eslint/typescript-estree>minimatch': 9.0.7
  # Transitive rentan — diblokir dependabot (security_update_not_possible):
  # - nanoid < 3.3.18 (GHSA-2v37-7h3g-55p8) — di-pin eas-cli@22.2.0
  # - js-yaml@3 < 3.15.1 (GHSA-5p4m-2wfm-xmqj, CVE-2026-59870) — via @oclif/core dkk
  #   (js-yaml@4 tetap aman 4.3.2, hanya override @3)
  # - fast-uri < 2.4.4 (GHSA-q3j6, v39h, 7p8r) — via @fastify/ajv-compiler dkk
  # - decode-uri-component <= 0.4.2 (GHSA-vcc3-ghjq-m6fr) — via query-string
  'nanoid': 3.3.18
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  'fast-uri': 2.4.4
  'decode-uri-component': 0.5.0
  # ===== VULNERABILITY CLEANUP (106 Dependabot alerts) — 2026-09-01 =====
  # US1: Critical & High — override transitive. Selector per-major agar versi
  # yang sudah aman di tree TIDAK di-downgrade/diubah.
  # shell-quote <=1.8.4 (CVE-2026-XXXXX) — naik dari 1.8.4 (di atas)
  'tar@7': 7.5.21                      # tar <=7.5.20 (GHSA-xxxx) — via eas-cli dkk; tar@6 (cacache) tak rentan
  'brace-expansion@<2': 1.1.18         # 1.x <1.1.16/17/18 (GHSA-xxxx)
  'brace-expansion@>=2 <5': 2.1.4      # 2.x <2.1.4 (GHSA-xxxx)
  'brace-expansion@>=5': 5.0.9         # >=3 <5.0.9 (GHSA-xxxx); 5.0.5 di tree rentan
  'protobufjs': 7.6.1                  # <=7.6.0 (GHSA-8gq9-2x98-8v72) — allowBuilds sudah ada
  '@xmldom/xmldom@<0.8.13': 0.8.13     # <0.8.13 (GHSA-xxx) — 0.8.13/0.9.10 di tree tetap
  'minimatch@5': 5.1.8                 # 5.x <5.1.8 (GHSA-xxxx) — @9/@10 di tree tetap
  'ws@6': 6.2.6                        # 6.x <6.2.4 (GHSA-xxxx) — 6.2.3 di tree
  'ws@7': 7.5.11                       # 7.x <7.5.11 (GHSA-xxxx) — 7.5.10 di tree
  '@grpc/grpc-js@>=1.14.0 <1.14.4': 1.14.4  # GHSA-xxxx — 1.9.16 di tree tetap
  'form-data@<2.5.6': 2.5.6           # 2.x <2.5.6 (GHSA-xxxx) — 2.5.5 di tree
  'form-data@>=4.0.0 <4.0.6': 4.0.6   # 4.x <4.0.6 (GHSA-xxxx) — 4.0.5 di tree; 3.x tetap
  'postcss@>=8.0.0 <8.5.18': 8.5.18   # <=8.5.17 (GHSA-xxxx) — 8.5.26 & 4.2.4 di tree tetap
  'tmp': 0.2.6                         # <0.2.6 (GHSA-xxxx) — 0.2.5 di tree
  'websocket-driver': 0.7.5            # <0.7.5 (GHSA-xxxx) — 0.7.4 di tree
  'fast-xml-builder': 1.1.7            # <=1.1.6 (GHSA-xxxx) — 1.1.5 di tree
  'sharp': 0.35.4                      # <0.35.0 (GHSA-xxxx) — 0.34.5 di tree; mobile sudah 0.35.4
  # fast-jwt (4 critical): DISELESAIKAN via upgrade @fastify/jwt@8 → @10
  #   (yang membawa fast-jwt@^6.2.4) — BUKAN override, agar plugin tetap kompatibel.
  # image-size <=2.0.2: NO-FIX — akan di-dismiss berjustifikasi.

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true