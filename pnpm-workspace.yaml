packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@parcel/watcher'

# Overrides dipindah dari package.json field "pnpm" (diabaikan sejak pnpm 10,
# dihapus di pnpm 11). Di sini pin diterapkan aktif oleh pnpm 10+.
